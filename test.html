<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전송 진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--ink:#08252F;--sea:#12798F;--line:#C9D8DB;--mist:#E9EFF0;}
  body{font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:var(--mist);
       color:var(--ink);margin:0;padding:1.2rem;line-height:1.6;}
  .wrap{max-width:720px;margin:0 auto;}
  h1{font-size:1.3rem;margin:0 0 .3rem;}
  p.sub{color:#456470;font-size:.92rem;margin:0 0 1.2rem;}
  label{display:block;font-weight:700;font-size:.92rem;margin:1rem 0 .35rem;}
  input{width:100%;padding:.8rem;border:1.5px solid var(--line);border-radius:10px;
        font:inherit;font-size:.9rem;box-sizing:border-box;}
  button{width:100%;min-height:3.3rem;margin-top:.7rem;border-radius:11px;border:0;
         background:var(--sea);color:#fff;font:inherit;font-weight:750;font-size:1rem;cursor:pointer;}
  button.alt{background:#fff;color:var(--sea);border:1.5px solid var(--sea);}
  pre{background:#08252F;color:#C8E6EC;padding:1rem;border-radius:11px;font-size:.78rem;
      white-space:pre-wrap;word-break:break-all;min-height:6rem;margin-top:1rem;}
  .ok{color:#7BE0A8;} .bad{color:#FF9E86;} .warn{color:#FFD98A;}
</style>

<div class="wrap">
  <h1>구글 시트 전송 진단</h1>
  <p class="sub">앱스 스크립트 주소를 넣고 버튼을 누르면, 어디서 막히는지 알려줍니다.</p>

  <label>앱스 스크립트 배포 주소 (…/exec)</label>
  <input id="url" placeholder="https://script.google.com/macros/s/AKfycbx2tRiWqbiI1I0MCgLHKsZkxhL_4JOY_H3MgmO5XQEsS9xJ_pk_9XP7Q9ebqcO1xQgb/exec">

  <button id="run">진단 시작</button>
  <button id="check" class="alt">설문 페이지의 SUBMIT_URL 확인</button>

  <pre id="log">여기에 결과가 나옵니다.</pre>
</div>

<script>
const $log = document.getElementById('log');
const P = (t, cls) => { $log.innerHTML += (cls ? `<span class="${cls}">${t}</span>` : t) + '\n'; };

document.getElementById('check').onclick = async () => {
  $log.innerHTML = '';
  P('설문 페이지에서 SUBMIT_URL 값을 읽는 중…\n');
  try{
    const r = await fetch('./index.html', {cache:'no-store'});
    const t = await r.text();
    const m = t.match(/const\s+SUBMIT_URL\s*=\s*'([^']*)'/);
    if(!m){ P('✗ SUBMIT_URL 줄을 찾지 못했습니다. 파일이 다를 수 있습니다.','bad'); return; }
    if(!m[1]){
      P('✗ SUBMIT_URL 이 비어 있습니다.  ← 이것이 원인입니다.','bad');
      P('  index.html 에서 주소를 넣고 다시 올려주세요.','bad');
    } else {
      P('✓ SUBMIT_URL 설정됨','ok');
      P('  ' + m[1]);
      if(!/\/exec$/.test(m[1])) P('  ⚠ 주소가 /exec 로 끝나지 않습니다.','warn');
      document.getElementById('url').value = m[1];
      P('\n위 칸에 채워 넣었습니다. [진단 시작]을 눌러 주세요.');
    }
    const v = t.includes('mode:\'no-cors\'') || t.includes('mode: \'no-cors\'');
    P('\n올라간 파일 버전 : ' + (v ? '최신 (3단계 전송)' : '구버전 — 새 index.html 로 교체 필요'),
      v ? 'ok' : 'warn');
  }catch(e){ P('✗ index.html 을 읽지 못했습니다: '+e.message,'bad'); }
};

document.getElementById('run').onclick = async () => {
  const url = document.getElementById('url').value.trim();
  $log.innerHTML = '';
  if(!url){ P('주소를 먼저 넣어 주세요.','bad'); return; }
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
    P('⚠ 주소 형태가 이상합니다. /exec 로 끝나야 합니다.','warn');
  }

  /* 1. 서버 살아있는지 */
  P('[1] 서버 응답 확인 (GET)');
  try{
    const r = await fetch(url, {redirect:'follow'});
    const t = await r.text();
    P('✓ 응답 받음','ok');
    P(t.split('\n').map(x=>'    '+x).join('\n'));
    if(t.includes('동작 중입니다') && !t.includes('연결된 문서')){
      P('⚠ 예전 코드가 돌고 있습니다. 새 .gs 붙여넣고 [배포 관리 → 새 버전]으로 재배포하세요.','warn');
    }
    if(t.includes('연결하지 못했습니다')){
      P('✗ 스크립트가 시트에 연결되지 않았습니다. SHEET_ID 를 지정하세요.','bad');
    }
  }catch(e){
    P('✗ 서버에 닿지 못했습니다: '+e.message,'bad');
    P('  → 액세스 권한이 "모든 사용자"인지 확인하세요.','bad');
  }

  /* 2. 실제 저장 시도 */
  const id = 'DIAG' + Date.now().toString(36).toUpperCase();
  const body = JSON.stringify({
    응답ID:id, 제출시각:new Date().toLocaleString('sv-SE'),
    q1:1, q33:'진단 페이지에서 보낸 테스트입니다', 경품동의:0
  });

  P('\n[2] 저장 요청 (POST) — 응답ID: '+id);
  let done = false;
  try{
    const r = await fetch(url, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
    const t = await r.text();
    P('✓ 서버 응답: '+t, t.includes('"ok":true') ? 'ok' : 'bad');
    done = t.includes('"ok":true');
  }catch(e){
    P('· 응답을 읽지 못했습니다 ('+e.message+')','warn');
    P('  차단된 것이 아니라 읽기만 막힌 것일 수 있어 no-cors 로 재시도합니다.');
    try{
      await fetch(url,{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},body});
      P('· no-cors 전송 완료 (결과는 확인 불가)','warn');
      done = null;
    }catch(e2){ P('✗ 전송 자체가 실패했습니다: '+e2.message,'bad'); }
  }

  P('\n[3] 결과');
  if(done === true){
    P('✓ 정상입니다. 시트 "응답" 탭 마지막 줄에 '+id+' 가 있는지 확인하세요.','ok');
  }else if(done === null){
    P('△ 전송은 했지만 확인이 안 됩니다.','warn');
    P('  시트에 '+id+' 가 있으면 → 정상 (설문도 잘 저장됩니다)');
    P('  시트에 없으면       → 서버가 거부한 것. [1]번 메시지를 확인하세요.');
  }else{
    P('✗ 저장되지 않았습니다. 위 메시지를 확인하세요.','bad');
  }
};
</script>
